<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký học Toán cô Lê Mai Phương</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="header">

        <img
            src="images/logo.png"
            alt="Logo"
            class="logo">

        <h1>TOÁN CÔ LÊ MAI PHƯƠNG</h1>

        <div class="phone">
            0984300883
        </div>

    </div>

    <div class="card">

        <div class="form-group">

            <label>
                <strong>Chọn lớp *</strong>
            </label>

            <select id="lopHoc">
                <option value="">-- Chọn lớp --</option>
                <option value="6">Lớp 6</option>
                <option value="7">Lớp 7</option>
                <option value="8">Lớp 8</option>
                <option value="9">Lớp 9</option>
            </select>

        </div>

        <div
            id="formSection"
            style="display:none;">

            <div class="form-group">

                <label>
                    <strong>Họ và tên học sinh *</strong>
                </label>

                <input
                    type="text"
                    id="hoTen"
                    placeholder="Nhập họ và tên học sinh">

            </div>

            <div class="form-group">

                <label>
                    <strong>Số điện thoại phụ huynh *</strong>
                </label>

                <input
                    type="text"
                    id="sdtPhuHuynh"
                    placeholder="Ví dụ: 0984300883">

            </div>

            <div class="form-group">

                <label>
                    <strong>Trường học sinh đang học *</strong>
                </label>

                <select id="truongHoc">
                </select>

            </div>

            <div class="schedule-box">

                <h2>Lịch học</h2>

                <img
                    id="scheduleImage"
                    src=""
                    alt="Lịch học">

            </div>

        </div>

        <button
            id="submitBtn"
            disabled>

            Đăng ký

        </button>

        <div id="message"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
